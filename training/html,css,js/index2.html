<!DOCTYPE html>
<html>

<head></head>

<body>

    <h1><span style="background-color: tomato;">This is a span title </span></h1>
    <h1>
        <div style="background-color: lightblue;">

            This is a div title


        </div>
    </h1>

    <p span style="background-color: tomato;">This is normal text</p>span</p>
    <p div style="background-color: blue;">This is normal text</div>
    </p>

    <!-- span inline and
         div block level container-->

    <h4>Groceries</h4>
    <ul>
        <li>milk</li>
        <li>eggs</li>
        <li>bread</li>
        <li>coffee </li>
        <ul>
            <li>beans</li>
            <li>sugar</li>
        </ul>
    </ul>

    <!--ordered list-->
    <h4>ToDO list</h4>
    <ol>
        <li>eat breakfast</li>
        <li>go to work</li>
        <li>go home</li>
        <li>sleep</li>

    </ol>
    <!--description list-->
    <dl style="background-color: lightgreen; border: 2px solid;">
        <!--description term-->
        <dt>dragon</dt>
        <!--description definition-->
        <dd>flying reptile</dd>
        <dt>pheonix</dt>
        <dd>fire bird</dd>
        <dt>snake</dt>
        <dd>snake is snake</dd>
    </dl>
