<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    	
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="mb-4">Available Courses</h1>

    <ol class="list-group list-group-numbered">
        <li th:each="course : ${courses}" class="list-group-item d-flex justify-content-between align-items-start">
            <div class="ms-2 me-auto">
                <div class="fw-bold" th:text="${course.name}"></div>
                <span th:text="${course.description}"></span>
            </div>
        	<span class="badge text-bg-primary rounded-pill" th:text="${course.hours} + ' hours'"></span>

        </li>
    </ol>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
