<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Member</title>
</head>
<body>
<a style="background-color : blue; color:white; padding:5px; border-radius:10px;" th:href="@{/home}">Home</a>
	<br>
    <h2>Update Member Form</h2>

    <form th:action="@{/members/update}" th:object="${member}" method="post">
        <input type="hidden" th:field="*{memberId}" />
        Name: <input type="text" th:field="*{name}" /><br/>
        Email: <input type="email" th:field="*{email}" /><br/>
        Mobile: <input type="number" th:field="*{mobile}" /><br/>
        Gender:
        <select th:field="*{gender}">
            <option th:each="g : ${genders}"
                    th:value="${g}"
                    th:text="${g.name()}">
            </option>
        </select><br/>
        Address: <input type="text" th:field="*{address}" /><br/>
        <input type="submit" value="Update Member" />
    </form>
</body>
</html>
