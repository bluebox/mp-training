<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Overdue Issued Books</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background-color: #2980b9;
            color: white;
        }

        tr:hover {
            background-color: #f0f8ff;
        }

        .no-data {
            text-align: center;
            color: #999;
            margin-top: 50px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h2>Books Issued Over One Month Ago</h2>

    <div th:if="${#lists.isEmpty(overdueBooks)}" class="no-data">
        No overdue books found.
    </div>

    <table th:if="${!#lists.isEmpty(overdueBooks)}">
        <thead>
            <tr>
                <th>Issue ID</th>
                <th>Book ID</th>
                <th>Member ID</th>
                <th>Status</th>
                <th>Issue Date</th>
                <th>Return Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="record : ${overdueBooks}">
                <td th:text="${record.issueId}">1</td>
                <td th:text="${record.bookId}">101</td>
                <td th:text="${record.memberId}">202</td>
                <td th:text="${record.status}">ISSUED</td>
                <td th:text="${record.issueDate}">2025-05-10</td>
                <td th:text="${record.returnDate != null ? record.returnDate : 'Not Returned'}">-</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
