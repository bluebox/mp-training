spring.application.name=LmsSpring
spring.main.allow-bean-definition-overriding=true
server.port=8080
#server.servlet.context-path=/api/v1
spring.datasource.url=jdbc:mysql://localhost:3306/lms_db
spring.datasource.username=${DB_USERNAME:devuser}
spring.datasource.password=${DB_PASSWORD:Vardhan@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
logging.level.com.library=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.jdbc=DEBUG
management.endpoints.web.exposure.include=health,info
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3004
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false
library.issue.duration=14
library.max.books.per.member=3
spring.security.user.name=admin
spring.security.user.password=admin123