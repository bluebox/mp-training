<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>
        Add Book
    </h1>
    <form class="form"  action="/LibraryServlets/addBook" method="post">

        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title" required><br><br>

        <label for="author">Author:</label><br>
        <input type="text" id="author" name="author" required><br><br>

        <label for="category">Category:</label><br>
        <input type="text" id="category" name="category" required><br><br>

        <label>Status (A/I):</label><br>
        <input type="radio" id="statusA" name="status" value="A" required>
        <label for="statusA">A</label>
        <input type="radio" id="statusI" name="status" value="I">
        <label for="statusI">I</label><br><br>

        <label>Availability (A/I):</label><br>
        <input type="radio" id="availA" name="availability" value="A" required>
        <label for="availA">A</label>
        <input type="radio" id="availI" name="availability" value="I">
        <label for="availI">I</label><br><br>

        <input type="submit" value="Submit">
        <input type="button" value="Back" onclick="window.location.href='Home.html'">

    </form>
    
</body>
</html>
