<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Issue Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/download.jpg'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            padding: 0;
        }

        .form-container {

            background-color: rgba(255, 255, 255, 0.5); 
            padding: 30px;
            border-radius: 10px;
            margin-top: 100px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: inline-block;
        }

        input[type="submit"] {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <center>
        <div class="form-container">
            <form action="issuerecords" method="get">
                <input type="submit" value="View Issue Records" />
            </form><br>
            <form action="issuebook" method="get">
                <input type="submit" value="Issue a Book" />
            </form><br>
            <form action="returnbook" method="get">
                <input type="submit" value="Return a Book" />
            </form>
        </div>
    </center>
</body>
</html>
