<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    form input, form select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .section {
      margin: 10px 0;
    }

    .section label {
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    table th, table td {
      padding: 10px;
      border: 1px solid #ccc;
    }

    table thead {
      background-color: #4CAF50;
      color: white;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #searchBox {
      padding: 8px;
      width: 60%;
    }

    #entryCount {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Registration Form</h2>
    <form id="dataForm">
      <input type="text" id="name" placeholder="Name" required />
      <input type="number" id="age" placeholder="Age" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="text" id="phone" placeholder="Phone Number" required />

      <div class="section">
        <label>Branch:</label>
        <label><input type="radio" name="branch" value="CSE" required /> CSE</label>
        <label><input type="radio" name="branch" value="ECE" /> ECE</label>
        <label><input type="radio" name="branch" value="EEE" /> EEE</label>
      </div>

      <div class="section">
        <label>Languages:</label>
        <label><input type="checkbox" value="English" /> English</label>
        <label><input type="checkbox" value="Hindi" /> Hindi</label>
        <label><input type="checkbox" value="French" /> French</label>
      </div>

      <select id="stateSelect" required>
        <option value="">Select State</option>
      </select>

      <select id="citySelect" required disabled>
        <option value="">Select City</option>
      </select>

      <button type="submit" id="addBtn" disabled>Add</button>
    </form>

    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search..." />
      <span id="entryCount">Total Entries: 0</span>
    </div>

    <table id="dataTable">
      <thead>
        <tr>
          <th>Name</th><th>Age</th><th>Email</th><th>Phone</th>
          <th>Branch</th><th>Languages</th><th>State</th><th>City</th><th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="controls">
      <button id="clearAllBtn">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
