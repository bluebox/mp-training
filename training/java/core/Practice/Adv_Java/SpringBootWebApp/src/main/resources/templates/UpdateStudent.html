<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Home</title>
	</head>
	<body>
		<h1>Update Student Form</h1>
		<div>
			<form th:action="@{/update/{id}(id=${student.id})}" method="post">
				<div>
					<ul th:if="${errors != null}">
        				<li th:each="err : ${errors}" th:value="${err.value}"></li>
    				</ul>
				</div>
				<div>
					<label for="fname">First Name: </label>
					<input type="text" id="fname" name="fname" th:value="${student.fname}"/>
				</div><br/>
				<div>
					<label for="lname">Last Name: </label>
					<input type="text" id="lname" name="lname" th:value="${student.lname}"/>
				</div><br/>
				<div>
					<label for="email">Email: </label>
					<input type="email" id="email" name="email" th:value="${student.email}"/>
				</div><br/>
				<div>
					<label for="dob">DoB: </label>
					<input type="date" id="dob" name="dob" th:value="${student.dob}"/>
				</div><br/>
				<div>
  					<label for="gender">Gender</label>
  					<select id="gender" name="gender" required>
    					<option value="" disabled selected>Select Your Gender</option>
    					<option value="M" th:selected="${student.gender.equals('M')}">Male</option>
    					<option value="F" th:selected="${student.gender.equals('F')}">Female</option>
  					</select>
				</div><br/>
				<div>
					<input type="submit" value="Update"/>
				</div>
			</form>
		</div>
	</body>
</html>
