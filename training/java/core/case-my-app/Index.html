<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Data Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Dynamic Data Management</h1>
    <form id="dataForm">
      <div class="form-row">
        <div class="form-group">
          <label>Name:</label>
          <input type="text" id="name" required />
          <span class="error" id="nameError"></span>
        </div>
        <div class="form-group">
          <label>Age:</label>
          <input type="number" id="age" min="1" required />
          <span class="error" id="ageError"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="email" required />
          <span class="error" id="emailError"></span>
        </div>
        <div class="form-group">
          <label>Phone Number:</label>
          <input type="text" id="phone" maxlength="10" required />
          <span class="error" id="phoneError"></span>
        </div>
      </div>

      <div class="form-group">
        <label>Branch:</label>
        <div class="inline-options">
          <label><input type="radio" name="branch" value="CSE" /> CSE</label>
          <label><input type="radio" name="branch" value="ECE" /> ECE</label>
          <label><input type="radio" name="branch" value="EEE" /> EEE</label>
        </div>
        <span class="error" id="branchError"></span>
      </div>

      <div class="form-group">
        <label>Languages:</label>
        <div class="inline-options">
          <label><input type="checkbox" value="English" class="lang" /> English</label>
          <label><input type="checkbox" value="Hindi" class="lang" /> Hindi</label>
          <label><input type="checkbox" value="French" class="lang" /> French</label>
        </div>
        <span class="error" id="langError"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>State:</label>
          <select id="state">
            <option value="">Select State</option>
          </select>
          <span class="error" id="stateError"></span>
        </div>
        <div class="form-group">
          <label>City:</label>
          <select id="city">
            <option value="">Select City</option>
          </select>
          <span class="error" id="cityError"></span>
        </div>
      </div>

      <button type="submit" id="addBtn">Add</button>
    </form>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search..." />
      <span id="count"></span>
    </div>

    <div class="table-container">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Name</th><th>Age</th><th>Email</th><th>Phone</th>
            <th>Branch</th><th>Languages</th><th>State</th><th>City</th><th>Action</th>
          </tr>
          <tr id="searchRow">
            <th><input type="text" class="col-search" data-col="0" placeholder="Search Name"></th>
            <th><input type="text" class="col-search" data-col="1" placeholder="Search Age"></th>
            <th><input type="text" class="col-search" data-col="2" placeholder="Search Email"></th>
            <th><input type="text" class="col-search" data-col="3" placeholder="Search Phone"></th>
            <th><input type="text" class="col-search" data-col="4" placeholder="Search Branch"></th>
            <th><input type="text" class="col-search" data-col="5" placeholder="Search Languages"></th>
            <th><input type="text" class="col-search" data-col="6" placeholder="Search State"></th>
            <th><input type="text" class="col-search" data-col="7" placeholder="Search City"></th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p id="noResults" class="hidden">No results found.</p>
  </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>
</body>
</html>
