<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>User Registration</title>
<style type="text/css">
	label {
		display: inline-block;
		width: 200px;
		margin: 5px;
		text-align: left;
	}
	input[type=text], input[type=password], select {
		display: inline-block;
		width: 200px;
	}
	input[type=radio] {
		margin-left: 45px;
	}
	button {
		padding: 5px;
		margin: 10px;
	}
	span{
		color:red;
	}
	
</style>
</head>
<body>
	<div align="center">
		<h1>User Registration</h1>
		<form action="#" th:action="@{/register}" method="post" th:object="${user}">
			<label>Full name:</label>
			 <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span><br/>
			<input type="text" th:field="*{name}" /><br/>
			 
			<label>E-mail:</label>
			<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span><br/>
			<input type="text" th:field="*{email}" /><br/>
					
			<label>Password:</label>
			<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span><br/>
			<input type="password" th:field="*{password}" /><br/>

			<label>Gender:</label>
			<span th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span><br/>
			<input type="radio" th:field="*{gender}" value="Male" />Male
			<input type="radio" th:field="*{gender}" value="Female" />Female<br/>
		
			<button type="submit">Register</button>		
		</form>
	</div>
</body>
</html>
