<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reservation Details</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Reservation Confirmed</h2>
        <p><strong>Name:</strong> <span th:text="${reserve.name}"></span></p>
        <p><strong>Date:</strong> <span th:text="${reserve.date}"></span></p>
        <p><strong>Time:</strong> <span th:text="${reserve.time}"></span></p>
        <a href="/reserve">Make another reservation</a>
    </div>
</body>

</html>
