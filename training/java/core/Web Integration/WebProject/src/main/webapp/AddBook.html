<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Book</title>
</head>
<body>
    <h2>Add Book</h2>

    <form method="post" action="./addBook">
        <label>Title:</label><br/>

        <label>Author:</label><br/>

        <label>Category:</label><br/>
        <input type="text" name="category" required /><br/><br/>

        <input type="submit" value="Add Book" />
    </form>

</body>
</html>
