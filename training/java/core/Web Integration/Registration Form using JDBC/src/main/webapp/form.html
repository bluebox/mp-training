<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Form</title>
</head>
<body>
	<form action="/Demo/demo">
		<table>
			<tr>
				<td><label for="name"> Name : </label></td>
				<td><input type="text" name="name"></td>
			</tr>
			<tr>
				<td><label> Age : </label></td>
				<td><input type="text" name="age"></td>
			</tr>
			<tr>
				<td><label> Email : </label></td>
				<td><input type="text" name="email"></td>
			</tr>
			<tr>
				<td><label> Phone no : </label></td>
				<td><input type="text" name="phno"></td>
			</tr>
			<tr>
				<td><label> Branch name : </label></td>
				<td>
					<input type="radio" name="branch" value="cse">CSE
					<input type="radio" name="branch" value="ece">ECE
					<input type="radio" name="branch" value="eee">EEE
				</td>
			</tr>
			<tr>
				<td><label> Languages you know : </label></td>
				<td><input type="checkbox" name="lang" value="Telugu">Telugu
					<input type="checkbox" name="lang" value="Hindi">Hindi
					<input type="checkbox" name="lang" value="English">English
				</td>
			</tr>
			<tr>
				<td><label> City : </label></td>
				<td><select name="city">
					<option value="Telangana">Telangana</option>
					<option value="Andra Pradesh">Andra Pradesh</option>
					<option value="Rajasthan">Rajasthan</option>
					<option value="Maharashtra">Maharashtra</option>
					<option value="Goa">Goa</option>
				</select></td>
			</tr>
			<tr>
				<td><label> City : </label></td>
				<td><input type="text" name="city"></td>
			</tr>
		</table>
	</form>
</body>
</html>
