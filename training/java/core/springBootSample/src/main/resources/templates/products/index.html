<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
	<div class="container">
	<h1 class="text-center my-4"> Products</h1>
	
	<a class="btn btn-primary" href="/products/create">Create Products</a>
	<form th:action="@{/logout}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <button type="submit" class="btn btn-danger float-end">Logout</button>
	</form>
	
	
	<table class="table">
	<thead>
	<tr>
	<td>ID</td>
	<td>Name</td>
	<td>Brand</td>
	<td>Category</td>
	<td>Price</td>
	<td>Image</td>
	<td>Created At</td>
	<td>Action</td>
		
	</tr>
	</thead>
	<tbody>
	<tr th:each="product : ${products}">
	<td th:text="${product.id}"></td>
	<td th:text="${product.name}"></td> 
	<td th:text="${product.brand}"></td> 
	<td th:text="${product.category}"></td>
	<td th:text="${product.price} + ' ₹'"></td>
	<td >
	<img th:src="@{'/images/'+${product.imageFileName}}" alt="..." width="100"/></td> 
	
	<td th:text="${product.createdAt.toString().substring(0,10)}"></td> 
	<td style="white-space:nowrap">
	<a class="btn btn-primary btn-sm"
	th:href="@{/products/edit(id=${product.id})}">Edit</a>
	
	<a class="btn btn-danger btn-sm"
	th:href="@{/products/delete(id=${product.id})}"
	onclick="return confirm('Are You sure?')">Delete</a>
	</td>
	</tr>
	</tbody>
	</table>
	
	</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
