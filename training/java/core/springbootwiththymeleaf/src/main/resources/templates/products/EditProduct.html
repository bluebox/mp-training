<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  </head>
  <body>
    <div class = "container">
    	<div class="row">
    		<div class="col-md-8 mx-auto rounded border p-4 m-4">
    			<h2 class="text-center md-5">Edit Product</h2>
    			
    			<form method="post" enctype="multipart/form-data" th:object="${productDTO}">
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Id</label>
    			<div class="col-sm-8">
    			<input readonly class="form-control-plaintext"th:value="${product.id}">
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Name</label>
    			<div class="col-sm-8">
    			<input class="form-control"th:field="*{name}">
    			<p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="${productDTO.name}"></p>
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Brand</label>
    			<div class="col-sm-8">
    			<input class="form-control" th:field="*{brand}">
    			<p th:if="${#fields.hasErrors('brand')}" th:errorclass="text-danger" th:errors="${productDTO.brand}"></p>
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Category</label>
    			<div class="col-sm-8">
    			<select class="form-select" th:field="*{category}">
    			<option value='Other'>Other</option>
    			<option value='Phones'>Phones</option>
    			<option value='Computer'>Computer</option>
    			<option value='Accessories'>Accessories</option>
    			<option value='Printer'>Printer</option>
    			<option value='Cameras'>Cameras</option>
    			</select>
    			<p th:if="${#fields.hasErrors('category')}" th:errorclass="text-danger" th:errors="${productDTO.category}"></p>
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Price</label>
    			<div class="col-sm-8">
    			<input class="form-control" type="number" step="0.01" min="0" th:field="*{price}">
    			<p th:if="${#fields.hasErrors('price')}" th:errorclass="text-danger" th:errors="${productDTO.price}"></p>
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Description</label>
    			<div class="col-sm-8">
    			<textarea class="form-control" th:field="*{description}"></textarea>
    			<p th:if="${#fields.hasErrors('description')}" th:errorclass="text-danger" th:errors="${productDTO.description}"></p>
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<div class="offset-sm-4 col-sm-8">
    			<img th:src="@{'/images/'+ ${product.imgUrl}}"
    			alt="..." width="150">
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-label">Image</label>
    			<div class="col-sm-8">
    			<input class="form-control" type="file" th:field="*{imageFile}">
    			<p th:if="${#fields.hasErrors('imageFile')}" th:errorclass="text-danger" th:errors="${productDTO.imageFile}"></p>
    			</div>
    			</div>
    			
    			<div class="row mb-3">
    			<label class="col-sm-4 col-form-lable">Created At</label>
    			<div class="col-sm-8">
    			<input class="form-control-plaintext" th:value="${product.createdAt}" readonly>
    			</div>
    			</div>
    			
    			<div class="row">
    			<div class="offset-sm-4 col-sm-4 d-grid">
    			<button type="submit" class="btn btn-primary">Submit</button>
    			</div>
    			<div class="col-sm-4 d-grid">
    			<a class="btn btn-outline-primary" href="/products" role="button">Cancel</a>
    			</div>
    			</div>
    			</form>
    		</div>
    	</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
  </body>
</html>
