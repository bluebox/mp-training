<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Capitals Checker</title>
</head>
<body>
    <h2>Capitals Checker</h2>

    <label for="countrySelect">country:</label>
    <select id="countrySelect">
        <option value="">select country</option>
    </select>

    <br/><br/>

    <label for="capitalSelect">capital:</label>
    <select id="capitalSelect">
        <option value="">select capital</option>
    </select>

    <br/><br/>

    <button onclick="checkMatch()">check match</button>

    <p id="result"></p>

    <script>
        const countries = {
            "india": "delhi",
            "USA": "new york",
            "germany": "berlin",
            "poland": "warsaw",
            "france": "paris",
            "russia": "moscow",
            "isreal": "tel aviv",
            "south africa": "cape town"
        };

        const countrySelect = document.getElementById("countrySelect");
        const capitalSelect = document.getElementById("capitalSelect");
        const result = document.getElementById("result");

        for (const country in countries) {
            const option = document.createElement("option");
            option.value = country;
            option.textContent =country;
            countrySelect.appendChild(option);
        }

        // Populate capitals dropdown
        const capitals = Object.values(countries);
        capitals.forEach(capital => {
            const option = document.createElement("option");
            option.value = capital;
            option.textContent = capital;
            capitalSelect.appendChild(option);
        });

        // Check if selected capital matches country
        function checkMatch() {
            const selectedCountry = countrySelect.value;
            const selectedCapital = capitalSelect.value;

            if (!selectedCountry || !selectedCapital) {
                result.textContent = "Please select both country and capital.";
                result.style.color = "red";
                return;
            }

            if (countries[selectedCountry].toLowerCase() === selectedCapital.toLowerCase()) {
                result.textContent = "correct ";
                result.style.color = "green";
            } else {
                result.textContent = "Incorrect";
                result.style.color = "red";
            }
        }
    </script>
</body>
</html>
