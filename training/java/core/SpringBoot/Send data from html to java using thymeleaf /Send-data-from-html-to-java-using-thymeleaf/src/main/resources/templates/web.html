<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<p th:each="i : ${l}">
		<ul>
			<li><h1 th:text="${i}"></h1></li>
		</ul>
	</p>
	<form action="/home" method="post">
		<label for="name">Name : </label>
		<input type="text" id="name" name="name" placeholder="Enter your name"/><br>

		<label for="age">Age : </label>
		<input type="number" id="age" name="age" max="30" min="15"/><br>

		<label for="sname">Where did you pursue your 10th class : </label>
		<input type="text" id="sname" name="sname"/><br>

		<label for="sType">School Type :</label>
		<input type="radio" id="ssc" name="sType" value="SSC"/>&nbsp;&nbsp;&nbsp;
		<label for="ssc">SSC</label>
		<input type="radio" id="cbse" name="sType" value="CBSE"/>&nbsp;&nbsp;&nbsp;
		<label for="cbse">CBSE</label><br>

		<label for="sgrade">10th class Grade: </label>
		<input type="text" id="sgrade" name="sgrade"/><br>

		<label for="inter">Where did you pursue your Inter:</label>
		<input type="text" id="inter" name="inter"/><br>

		<label for="dept1">Preferred Branch 1: </label>
		<select id="dept1" name="dept1">
			<option disabled selected>Choose your preferred branch 1</option>
			<option value="cse">Computer Science and Engineering</option>
			<option value="ai">Artificial Intelligence</option>
			<option value="aiml">Artificial Intelligence and Machine Learning</option>
			<option value="ds">Data Science</option>
			<option value="cs">Cyber Security</option>
			<option value="it">Information Technology</option>
			<option value="ece">Electronics and Computer Engineering</option>
			<option value="eee">Electrical and Electronics Engineering</option>
			<option value="mech">Mechanical Engineering</option>
			<option value="ce">Civil Engineering</option>
		</select><br>

		<label for="dept2">Preferred Branch 2: </label>
		<select id="dept2" name="dept2">
			<option disabled selected>Choose your preferred branch 2</option>
			<option value="cse">Computer Science and Engineering</option>
			<option value="ai">Artificial Intelligence</option>
			<option value="aiml">Artificial Intelligence and Machine Learning</option>
			<option value="ds">Data Science</option>
			<option value="cs">Cyber Security</option>
			<option value="it">Information Technology</option>
			<option value="ece">Electronics and Computer Engineering</option>
			<option value="eee">Electrical and Electronics Engineering</option>
			<option value="mech">Mechanical Engineering</option>
			<option value="ce">Civil Engineering</option>
		</select><br>

		<label for="dept3">Preferred Branch 3: </label>
		<select id="dept3" name="dept3">
			<option disabled selected>Choose your preferred branch 3</option>
			<option value="cse">Computer Science and Engineering</option>
			<option value="ai">Artificial Intelligence</option>
			<option value="aiml">Artificial Intelligence and Machine Learning</option>
			<option value="ds">Data Science</option>
			<option value="cs">Cyber Security</option>
			<option value="it">Information Technology</option>
			<option value="ece">Electronics and Computer Engineering</option>
			<option value="eee">Electrical and Electronics Engineering</option>
			<option value="mech">Mechanical Engineering</option>
			<option value="ce">Civil Engineering</option>
		</select><br>

		<input type="submit" value="submit">
	</form>
</body>
</html>
