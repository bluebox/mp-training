<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
	<div th:if="${error!=null}">
        <p th:text="${error}"></p>
    </div>
    <form action="/addData" method="post" th:object="${books}">
        <label for="bookId">Book ID : </label>
         <input type="number" name="bookId" th:field="*{bookId}" min="0"/><br>
         <label for="title">Title : </label>
         <input type="text" name="title" th:field="*{title}"/><br>
         <label for="author">Author : </label>
         <input type="text" name="author" th:field="*{author}"/><br>
         <label for="category">Category : </label>
         <input type="text" name="category" th:field="*{category}"/><br>
         <input type="submit" value="submit">
    </form>
    <a href="@{/main}">Main Page</a>
    <a href="@{/logout}">log Out</a>
</body>
</html>
