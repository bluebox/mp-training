<!DOCTYPE html>
<html>
    <head>
        <script src = "dom.js"></script>
        <link rel="stylesheet" href="stylelib.css">
    </head>
    <body>
        <div class = "table">
            <div class = "">
                <h2>Users</h2>
                <form id = "userForm">
                    <label for="Name">Name</label>
                    <input id="name" name="name"><br>
                    <label for="age">Age</label>
                    <input id="age" name = "age"><br>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email"><br>
                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="number"><br>
                    <label for="branch">Branch</label><br>
                    <input type="radio" id="cse" name="branch" value="CSE">
                    <label for="CSE">CSE</label>
                    <input type="radio" id="ece" name="branch" value="ECE">
                    <label for="ECE">ECE</label>
                    <input type="radio" id="eee" name="branch" value="EEE">
                    <label for="EEE">EEE</label>
                    <label for="languages"></label><br>
                    <input type="checkbox" id="english" name="language" value="English">
                    <label for="English">English</label>
                    <input type="checkbox" id="hindi" name="language" value="Hindi">
                    <label for="Hindi">Hindi</label>
                    <input type="checkbox" id="telugu" name="language" value="Telugu">
                    <label for="Telugu">Telugu</label><br>
                    <label for="state">State</label>
                    <!-- <select id="state">
                        <option value="">Select State</option>
                    </select> -->
                    <input id="state" name="state">
                    <label for="city">City</label>
                    <!-- <select id="city">
                        <option value="">Select City</option>
                    </select> -->
                    <input id="city" name="city">
                    <button type="submit">Submit</button>

                </form>
            </div>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Branch</th>
                    <th>Languages</th>
                    <th>State</th>
                    <th>City</th>
                </tr>
                <tr>
                    
                </tr>
            </table>
        </div>
    </body>
</html>
