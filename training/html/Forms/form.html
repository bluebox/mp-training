<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h1 style="text-align: center;">Form Demo</h1>
    <div class="form">
        <form action="">
        <label for="fname">First Name</label><br>
        <input type="text" name="fname" id="">
        <br>
        <label for="lname">Last Name</label><br>
        <input type="text" name="lname">
        <br>

        <label for="username">User name</label><br>
        <input type="text" name="username" id="">
        <br>
        <label for="password">Password</label> <br>
        <input type="password" name="password" id="">
        <br>

        <label for="gmail">Gmail</label><br>
        <input type="text" name="gmail" id="">
        <br>

        <label>Gender</label><br>

        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <br>

        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">
        <br>
        <label for="subjects">Subjects You Know</label><br>
            <label for="html">HTML</label>

            <label for="java">Java</label>
            <input type="checkbox" name="java" id=""><br> 
            
            <label for="python">Python</label>
            <input type="checkbox" name="python" id=""><br>
            
            <label for="cn">Computer Networks</label>
            <input type="checkbox" name="cn" id="">
        <br>
        <label for="dob">Date of Birth</label><br>
        <input type="date" name="dob" id=""><br>

        <label for="act">Extra curiculam activities</label><br>
        <textarea name="act" id="" rows="4" cols="40"></textarea><br>

        <input type="submit" name="" id="">

    </form>
    </div>
