<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Form</title>
</head>
<body>
  <div id="form-div">
    <form onsubmit="return dataSubmitted()">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="text" id="age" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label for="mobile">Mobile</label>
        <input type="text" id="mobile" required pattern="[0-9]{10}" maxlength="10" />
      </div>

      <div class="form-group">
        <label>Select Branch</label>
        <div class="radio-group">
          <label><input type="radio" name="branch" required /> CSE</label>
          <label><input type="radio" name="branch" required /> ECE</label>
          <label><input type="radio" name="branch" required /> EEE</label>
        </div>
      </div>

      <div class="form-group">
        <label for="state">Choose your state</label>
        <select id="state" name="state" required>
          <option value="">--Select--</option>
          <option value="state">Telangana</option>
        </select>
      </div>

      <div class="form-group">
        <label for="city">Choose your city</label>
        <select id="city" name="city" required>
          <option value="">--Select--</option>
          <option value="city">Hyderabad</option>
        </select>
      </div>

      <input type="submit" id="submit" value="Submit" />
    </form>
  </div>
  <div id="table-div">
    <h2>Submitted Data</h2>
<table id="data-table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Age</th>
      <th>Email</th>
      <th>Mobile</th>
      <th>Branch</th>
      <th>State</th>
      <th>City</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    <!-- Rows will be added here dynamically with JS -->
  </tbody>
</table>

  </div>
  <script src="script.js"></script>
</body>
</html>
