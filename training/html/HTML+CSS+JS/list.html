<!DOCTYPE html>
<html lang="en">
<head>
    <title>list</title>
</head>
<body>
    <ul style="list-style-type: circle;">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
      </ul>

      <br>
      <ol type="i">
            <li>Coffee</li>
            <li>tea</li>
            <li>milk</li>
      </ol>
      <br>
      <ol start="98">
            <li>Coffee</li>
            <ul style="list-style-type: circle;">
                <li>hot coffee</li>
                <li>cold coffee</li>
            </ul>
            <li>tea</li>
                <ul>
                    <li>Elachi</li>
                    <li>badam</li>  
                    <li>ginger</li>
                </ul>
            <li>Milk</li>
      </ol>

</body>
</html>
