<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <!-- <h1 style="text-align:center">Simple Form</h1> -->
    <table>
        <form>
            <caption>Simple form</caption>
            <tr>
                <td>
                    <label for="Name">Name : </label>
                </td>
                <td>
                    <input type="text" id="Name" maxlength="10">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">email : </label>
                </td>
                <td>
                    <input type="email" id="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="mobile">Mobile : </label>
                </td>
                <td>
                    <input type="number" id="mobile">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Gender"> Gender: </label>
                </td>
                <td>
                    <input type="radio" id="Male" name="Gender" value="Male">
                    <label for="Male">Male</label>
                    <input type="radio" name="Gender" id="Female" value="Female">
                    <label for="Female">Female</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Age">Age : </label>
                </td>
                <td>
                    <input type="number" id="Age" >
                </td>
            </tr>
            
            <tr>
                <td><label for="Hobbies">Hobbies</label></td>
                <td>
                    <input type="checkbox" name="Hobbies" id="Cooking" value="Cooking">
                    <label for="Cooking">Cooking</label>
                    <br>
                    <input type="checkbox" name="Hobbies" id="Playing" value="Playing">
                    <label for="Playing">Cooking</label>
                    <br>
                    <input type="checkbox" name="Hobbies" id="Watching" value="Watching">
                    <label for="Watching">Watching</label>
                    
                </td>
            </tr>
            <tr align="center"></tr>
                <td colspan="2">
                    <input type="submit" value="submit">
                </td>
            </tr>
        </form>
    </table>


    <iframe src="Sample.html" height="400px" width="500px"></iframe>
</body>
</html>
