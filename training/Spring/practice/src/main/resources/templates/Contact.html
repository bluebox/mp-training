<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>Contact Details</title>
</head>
<body>
	<h2>Contact Form</h2>

	<form th:action="@{/save}" method="post" th:object="${contact}">
		<div th:if="${#fields.hasErrors('*')}"
			style="color: red; padding: 10px; margin-bottom: 15px;">
			<p>
				<strong>Please fix the following errors:</strong>
			</p>
			<ul>
				<li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
			</ul>
		</div>
		<label for="name">Name:</label> <input type="text" id="name"
			th:field="*{name}" /><br /> <br /> <label for="number">Contact
			Number:</label> <input type="text" id="number" th:field="*{number}" /><br />
		<br /> <label for="age">Age:</label> <input type="number" id="age"
			th:field="*{age}" /><br /> <br /> <label for="email">Email:</label>
		<input type="email" id="email" th:field="*{email}" /><br /> <br />
		<label for="address">Address:</label> <input type="text" id="address"
			th:field="*{address}" /><br /> <br />

		<button type="submit">Submit</button>
	</form>
</body>
</html>
