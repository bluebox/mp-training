<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Response</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f2f7fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
    }

    .message {
        font-size: 20px;
        color: #2c3e50;
        background-color: #ffffff;
        border: 1px solid #d0dbe5;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        text-align: center;
        margin-bottom: 25px;
    }

    .button {
        padding: 12px 24px;
        font-size: 15px;
        font-weight: bold;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .button:hover {
        background-color: #2980b9;
    }

    form {
        text-align: center;
    }
</style>
</head>
<body>

    <div class="message" th:text="${message}">Default message</div>

    <form th:action="@{${targetUrl}}" method="get">
        <button class="button" type="submit" th:text="${buttonLabel}">Go</button>
    </form>

</body>
</html>
