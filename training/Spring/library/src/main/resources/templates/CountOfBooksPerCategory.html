<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Categories Count</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f8fc;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        table {
            width: 50%;
            margin: 0 auto 30px auto;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .button-container {
            text-align: center;
        }

        .main-button {
            background-color: #28a745;
            color: white;
            padding: 10px 18px;
            font-size: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .main-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h2>Book Count by Category</h2>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Number of Books</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="entry : ${categoryCount}">
                <td th:text="${entry.key}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
        </tbody>
    </table>

    <div class="button-container">
        <form th:action="@{/MainMenu}" method="get">
            <button type="submit" class="main-button">Back to Main Menu</button>
        </form>
    </div>

</body>
</html>
