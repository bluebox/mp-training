<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Message Sent</title>
</head>
<body>
    <h1>Thank You, {{ name }}!</h1>

    <p>We received your message:</p>

    <p><strong>Email:</strong> {{ email }}</p>
    <p><strong>Message:</strong><br> {{ message }}</p>

    <p><a href="{% url 'contact' %}">Send another message</a></p>
</body>
</html>
