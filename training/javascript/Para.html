<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function myfun(){
            document.getElementById("para").innerHTML="<h1>Good Afertnoon every one....</h1>";
        }
    </script>

    <style>
        .main{
            margin: auto;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="main">
        <h1>Welcome to Javascript...</h1>
        <h2>Hi very one!</h2>
        <p id="para">Good morning!</p>
        <button onclick="myfun()">Change it</button>
    </div>
</body>
</html>
