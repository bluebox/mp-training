<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function getData(){
            let num = document.getElementById("num").value;
            document.getElementById("output").textContent = "Counter : "+num;
        }
        // alert("num is : "+num);
        function increment(){
                let num = document.getElementById("num").value;
            // return num+1;
                    document.getElementById("output").textContent = "Counter : "+num;

        }

        function decrement(){
            // return num-1;
                            let num = document.getElementById("num").value;

                    document.getElementById("output").textContent = "Counter : "+num;

        }
        document.getElementById("output").textContent = "Counter : "+num;
    </script>
</head>
<body>
    <div class="main">
        <input type="number" name="" id="num" required placeholder="Enter number">
        <br>
        <button onclick="getData()">Submit</button>
        <br>
        <button onclick="decrement()">-</button>
        <h1 id="output"></h1>
        <button onclick="increment()">+</button>
    </div>
</body>
</html>
