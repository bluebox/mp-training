<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: rgb(229, 255, 255);
        }
        form{
            padding: 20px;
            background-color: white;
            border-radius: 20px;
            width: 400px;
        }
        div{
            margin-top: 20px;
        }
        input{
            padding-top: 20px;
            width: 100%;
            border-radius: 10px;
            font-size: 20px;
        }
        input:focus{
            border-color: white;
        }
        label{
            margin-bottom: 30px;
        }
        .button{
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <form action="" >
        <h1 style="text-align: center">Signup</h1>
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
        </div>
        <div>
            <label for="email">email</label>
            <input type="text" id="email" name="email">
        </div>
        <div>
            <label for="Password">Password</label>
            <input type="text" id="Password" name="Password">
        </div>
        <div class="button">
            <button type="submit" style="padding: 10px;margin: 10px;border-radius: 20px;">submit</button>
        </div>
    </form>
</body>
</html>
