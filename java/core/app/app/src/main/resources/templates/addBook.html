<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
	<h1 th:text="'Add Book'"></h1>
	<form action="" method="post">
		Book Title : <input type="text" name="title"	required/><br><br>
		Book Author : <input type="text" name="author"	required/><br><br>
		Book Category : <input type="text" name="category"	required/><br><br>
		Book Status <br><br>
		 <input type="radio" name="status" value="active"	required/> Active<br><br>
		 <input type="radio" name="status" value="inactive"	/> Inactive<br><br>
		Book Availability <br><br>
		 <input type="radio" name="availability" value="available"	required/>Available<br><br>
		 <input type="radio" name="availability" value="issued"	/>Issued<br><br>
		<input type="submit"/><br><br>
	</form>
	
	 <a th:href="@{/home}">
        <button>Go to main menu</button>
    </a>
</body>
</html>
