<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Update Book</title>
</head>
<body>
	<h1>Update Book Details</h1>
	<form action="./updateBook" method="post">
		Book ID : <input type="text" name="bookId"	/><br>
		Book Title : <input type="text" name="title"	/><br>
		Book Author : <input type="text" name="author"	/><br>
		Book Category : <input type="text" name="category"	/><br>
		Book Status <br>
		 <input type="radio" name="status" value="active"	/> Active<br>
		 <input type="radio" name="status" value="inactive"	/> Inactive<br>
		Book Availability <br>
		 <input type="radio" name="availability" value="available"	/> Available<br>
		 <input type="radio" name="availability" value="issued"	/> Issued<br>
		<input type="Submit"/>
	</form>
	<button onclick="location.href='mainMenu.html'" type="button">Go to back Main Menu</button>
</body>
</html>
