<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Form</title>
</head>
<body>
    <h2>Enter User Details</h2>
    <form action="user" method="post">
        <label>Name</label><br>
        <input type="text" name="name" required><br><br>

        <label>Age</label><br>
        <input type="number" name="age" required><br><br>

        <button type="submit">Enter</button>
    </form>
</body>
</html>
