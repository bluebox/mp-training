<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="form-table-wrapper">
      
      <!-- Form Section -->
      <div class="form-section">
        <h2>Registration Form</h2>
        <form id="dataForm">
          <label>Name:</label>
          <input type="text" id="name" name="name" required>

          <label>Age:</label>
          <input type="number" id="age" name="age" required>

          <label>Email:</label>
          <input type="email" id="email" name="email" required>

          <label>Phone Number:</label>
          <input type="text" id="phone" name="phone" required maxlength="10">

          <label>Branch:</label>
          <div class="radio-group">
            <label><input type="radio" name="branch" value="CSE"> CSE</label>
            <label><input type="radio" name="branch" value="ECE"> ECE</label>
            <label><input type="radio" name="branch" value="EEE"> EEE</label>
          </div>

          <label>Languages Known:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" class="lang" value="English"> English</label>
            <label><input type="checkbox" class="lang" value="Hindi"> Hindi</label>
            <label><input type="checkbox" class="lang" value="French"> French</label>
          </div>

          <label>State:</label>
          <select id="stateSelect" name="state" required>
            <option value="">--Select State--</option>
          </select>

          <label>City:</label>
          <select id="citySelect" name="city" required>
            <option value="">--Select City--</option>
          </select>

          <button type="submit" id="addBtn">Add</button>
        </form>

        <input type="text" id="searchInput" placeholder="Search entries..." />
        <p id="entryCount">Total Entries: 0</p>
        <p id="noResults" style="display:none;">No matching results found.</p>
      </div>

      <!-- Table Section -->
      <div class="table-section">
        <h2>Submitted Data</h2>
        <table id="dataTable" border="1">
          <thead>
            <tr>
              <th>Name</th><th>Age</th><th>Email</th><th>Phone</th>
              <th>Branch</th><th>Languages</th><th>State</th><th>City</th><th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="form.js"></script>
</body>
</html>
