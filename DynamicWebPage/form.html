<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Information Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Student Information</h2>
    <form>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="1" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" pattern="\d{10}" required>

      <label>Branch:</label>
      <label><input type="radio" name="branch" value="CSE" required> CSE</label>
      <label><input type="radio" name="branch" value="ECE"> ECE</label>
      <label><input type="radio" name="branch" value="EEE"> EEE</label>

      <label>Languages Known:</label>
      <label><input type="checkbox" name="languages" value="English"> English</label>
      <label><input type="checkbox" name="languages" value="Hindi"> Hindi</label>
      <label><input type="checkbox" name="languages" value="French"> French</label>

      <label for="state">State:</label>
      <select id="state" name="state" required>
        <option value="">-- Select State --</option>
      </select>

      <label for="city">City:</label>
      <select id="city" name="city" required>
        <option value="">-- Select City --</option>
      </select>

      <button type="submit">Submit</button>
    </form>
  </div>

  <script src="form.js"></script>
</body>
</html>
