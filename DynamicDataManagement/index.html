<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DYNAMIC DATA MANAGEMENT</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>Student Registration Form</h2>
    <form id="dataForm">
     <label>Name: </label>
     <input type="text" id="name" required>
     <label>Age: </label>
     <input type="number" id="age" required >
    <label>Email:</label>
    <input type="email" id="email" required>
    <label>Phone Number:</label>
     <input type="text" id="phone" maxlength="10" required>
    
      <label>Branch:</label>
      <div class="radio-group">
        <label><input type="radio" name="branch" value="CSE">CSE</label>
        <label><input type="radio" name="branch" value="ECE">ECE</label>
        <label><input type="radio" name="branch" value="EEE">EEE</label>
      </div>

      <label>Languages Known:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="languages" value="English">English</label>
        <label><input type="checkbox" name="languages" value="Hindi">Hindi</label>
        <label><input type="checkbox" name="languages" value="French">French</label>
      </div>

      <label>State:</label>
      <select id="state" required></select>

      <label>City:</label>
      <select id="city" required></select>

      <button type="submit" id="addBtn" disabled>Add</button>
    </form>

    <input type="text" id="search" placeholder="Search">
    <p id="entryCount"></p>
    <table id="dataTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Branch</th>
          <th>Languages</th>
          <th>State</th>
          <th>City</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="noResults" style="display:none;">No results found.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
