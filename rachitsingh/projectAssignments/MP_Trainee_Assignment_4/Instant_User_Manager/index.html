<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instant User Manager</title>

    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/form.css" />
    <link rel="stylesheet" href="css/table.css" />
    <link rel="stylesheet" href="css/error.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <div class="container">
      <h1>Add User Data</h1>

      <form id="dataForm" autocomplete="off">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" />
          <span class="error" id="inputNameError"></span>
        </div>

        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="1" />
          <span class="error" id="inputAgeError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" />
          <span class="error" id="inputEmailError"></span>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" name="phone" maxlength="10" />
          <span class="error" id="inputPhoneError"></span>
        </div>

        <fieldset class="form-group">
          <legend>Branch:</legend>
          <label><input type="radio" name="branch" value="CSE" /> CSE</label>
          <label><input type="radio" name="branch" value="ECE" /> ECE</label>
          <label><input type="radio" name="branch" value="EEE" /> EEE</label>
          <span class="error" id="inputBranchError"></span>
        </fieldset>

        <fieldset class="form-group">
          <legend>Languages Known:</legend>
          <label
            ><input type="checkbox" name="languages" value="English" />
            English</label
          >
          <label
            ><input type="checkbox" name="languages" value="Hindi" />
            Hindi</label
          >
          <label
            ><input type="checkbox" name="languages" value="French" />
            French</label
          >
          <span class="error" id="inputLanguagesError"></span>
        </fieldset>

        <div class="form-group">
          <label for="state">State:</label>
          <select id="state" name="state">
            <option value="">-- Select State --</option>
          </select>
          <span class="error" id="inputStateError"></span>
        </div>

        <div class="form-group">
          <label for="city">City:</label>
          <select id="city" name="city">
            <option value="">-- Select City --</option>
          </select>
          <span class="error" id="inputCityError"></span>
        </div>

        <button type="submit" id="addButton" disabled>Add Entry</button>
      </form>

      <div class="search-box">
        <input
          type="text"
          id="searchBarInput"
          placeholder="Search by any field..."
        />
      </div>

      <div class="table-wrapper">
        <table id="dataTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Branch</th>
              <th>Languages</th>
              <th>State</th>
              <th>City</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="entryCount"></p>
        <p id="noResults" class="hidden">No results found.</p>
      </div>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.6.4.min.js"
      integrity="sha256-pvI7JLu0X4oFCKUnM3swUHYw7H37DhUFTNQf/2vCZH0="
      crossorigin="anonymous"
    ></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/form.js"></script>
    <script src="js/table.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
