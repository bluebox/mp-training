<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Overdue Records</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f9fafb; }
        h2 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 0 8px rgba(0, 0, 0, 0.08); }
        th, td { padding: 12px 16px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #e2e8f0; }
        .error { color: red; margin-bottom: 20px; }
    </style>
</head>
<body>

<h2>Overdue Records</h2>
<div th:if="${error}" class="error" th:text="${error}"></div>
<table>
    <thead>
        <tr>
            <th>Issue ID</th>
            <th>Book ID</th>
            <th>Member ID</th>
            <th>Issue Date</th>
            <th>Return Date</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="record : ${overdueRecords}">
        <td th:text="${record.issueId}"></td>
        <td th:text="${record.bookId}"></td>
        <td th:text="${record.memberId}"></td>
        <td th:text="${record.issueDate}"></td>
        <td th:text="${record.returnDate != null ? record.returnDate : '-'}"></td>
        <td th:text="${record.status}"></td>
    </tr>
    <tr th:if="${overdueRecords == null or #lists.isEmpty(overdueRecords)}">
        <td colspan="6">No overdue records found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
