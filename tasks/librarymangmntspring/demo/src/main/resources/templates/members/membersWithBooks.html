<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Members With Books</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f9fafb; }
        h2 { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 0 8px rgba(0, 0, 0, 0.08); }
        th, td { padding: 12px 16px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #e2e8f0; }
        .error { color: red; margin-bottom: 20px; }
    </style>
</head>
<body>
<h2>Members With Active Issued Books</h2>
<div th:if="${error}" class="error" th:text="${error}"></div>
<table>
    <thead>
        <tr>
            <th>Member ID</th>
            <th>Member Name</th>
            <th>Book ID</th>
            <th>Book Name</th>
            <th>Mobile</th>
            <th>Address</th>
            <th>Issue Date</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="dto : ${membersWithBooks}">
        <td th:text="${dto.memberId}"></td>
        <td th:text="${dto.memberName}"></td>
        <td th:text="${dto.bookId}"></td>
        <td th:text="${dto.bookName}"></td>
        <td th:text="${dto.mobile}"></td>
        <td th:text="${dto.address}"></td>
        <td th:text="${dto.issueDate}"></td>
    </tr>
    <tr th:if="${membersWithBooks == null or #lists.isEmpty(membersWithBooks)}">
        <td colspan="7">No members with active issued books found.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
