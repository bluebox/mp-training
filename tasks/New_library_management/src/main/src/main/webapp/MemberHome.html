<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Members Home</title>





<style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('images/download.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .content {
            background-color: rgba(255, 255, 255, 0.5);
            display: inline-block;
            padding: 25px 40px;
            margin: 60px auto;
            border-radius: 8px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        form, a {
            display: block;
            margin: 10px auto;
        }

        button, input[type="submit"] {
            padding: 10px 20px;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover, input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body style="display:flex;flex-direction:column;align-items:center;">
 <center>
        <div class="content">
            <h2>Members</h2>

            <form action="ViewAllMembersController" method="get">
                <input type="submit" value="View Members Table" />
            </form>

            <form action="AddMemberController" method="get">
                <input type="submit" value="Add Member"/>
            </form>

            <form action="UpdateMemberController" method="get">
                <input type="submit" value="Update Member"/>
            </form>
        </div>
    </center>

</body>
</html>
